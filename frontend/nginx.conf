# Bot User-Agent detection
map $http_user_agent $is_bot {
    default 0;
    ~*Googlebot-Image 0;
    ~*(Googlebot|Google-InspectionTool|GoogleOther|AdsBot-Google|Storebot-Google|Mediapartners-Google|APIs-Google|FeedFetcher-Google|Google-Read-Aloud|Google-Site-Verification|bingbot|BingPreview|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Slackbot|Discordbot|Applebot|Pinterestbot|Snapchat|vkShare|W3C_Validator|redditbot|GPTBot|PerplexityBot|ClaudeBot|Google-Extended|OAI-SearchBot|cohere-ai|anthropic-ai) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://clientes.conectaai.cl https://cloudflareinsights.com https://static.cloudflareinsights.com https://www.flow.cl https://sandbox.flow.cl https://api.mercadopago.com https://wa.me https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com; frame-src https://www.flow.cl https://sandbox.flow.cl https://www.mercadopago.cl https://datastudio.google.com https://lookerstudio.google.com; object-src 'none';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Slugs de productos heredados (URLs antiguas con slug) -> IDs numéricos canonicos
    location = /product/hub-domotica-control-inteligente     { return 301 /product/2; }
    location = /product/interruptor-luz-inteligente-wifi     { return 301 /product/3; }
    location = /product/controlador-wifi-motor-cortinas      { return 301 /product/4; }
    location = /product/roller-dual                          { return 301 /product/5; }
    location = /product/roller-duo-blackout                  { return 301 /product/6; }
    location = /product/roller-duo-traslucido                { return 301 /product/7; }
    location = /product/roller-blackout                      { return 301 /product/8; }
    location = /product/roller-screen                        { return 301 /product/10; }
    location = /product/roller-sunscreen                     { return 301 /product/10; }
    location = /product/persiana-exterior                    { return 301 /product/11; }
    location = /product/minipersiana                         { return 301 /product/12; }
    location = /product/persiana-madera                      { return 301 /product/13; }
    location = /product/toldo-retractil                      { return 301 /product/14; }
    location = /product/toldos-verticales                    { return 301 /product/15; }
    location = /product/cierre-terraza-cristal               { return 301 /product/16; }
    location = /product/cierre-terraza-pvc                   { return 301 /product/17; }
    location = /product/cerradura-magnetica-180kg            { return 301 /product/18; }
    location = /product/control-remoto-teclera               { return 301 /product/20; }
    location = /product/cortinas-verticales                  { return 301 /product/21; }
    # Prefijo /producto/ (variante en español) -> ID numérico
    location = /producto/malla-de-seguridad-para-ventanas                { return 301 /product/22; }
    location = /producto/cierre-para-terraza-con-paneles-deslizantes     { return 301 /product/16; }
    location ~ ^/producto/.+                                             { return 301 /catalog; }

    # URLs antiguas/variantes -> canonical (un solo salto, con o sin trailing slash)
    # Sub-rutas de prefijos viejos (ej: /cortinas-roller/macul, /persianas/exterior)
    # Comunas propias del viejo formato /cortinas-roller/ -> /cortinas/ (redirige link equity)
    location = /cortinas-roller/las-condes       { return 301 /cortinas/las-condes; }
    location = /cortinas-roller/providencia      { return 301 /cortinas/providencia; }
    location = /cortinas-roller/vitacura         { return 301 /cortinas/vitacura; }
    location = /cortinas-roller/lo-barnechea     { return 301 /cortinas/lo-barnechea; }
    location = /cortinas-roller/nunoa            { return 301 /cortinas/nunoa; }
    location = /cortinas-roller/la-reina         { return 301 /cortinas/la-reina; }
    location = /cortinas-roller/maipu            { return 301 /cortinas/maipu; }
    location = /cortinas-roller/la-florida       { return 301 /cortinas/la-florida; }
    location = /cortinas-roller/san-miguel       { return 301 /cortinas/san-miguel; }
    location = /cortinas-roller/penalolen        { return 301 /cortinas/penalolen; }
    location = /cortinas-roller/colina           { return 301 /cortinas/colina; }
    location = /cortinas-roller/macul            { return 301 /cortinas/macul; }
    location = /cortinas-roller/la-cisterna      { return 301 /cortinas/la-cisterna; }
    location = /cortinas-roller/santiago-centro  { return 301 /cortinas/santiago-centro; }
    location = /cortinas-roller/estacion-central { return 301 /cortinas/estacion-central; }
    location = /cortinas-roller/puente-alto      { return 301 /cortinas/puente-alto; }
    location ~ ^/cortinas-roller/.+              { return 301 /catalog; }
    location ~ ^/cortinas-roller-santiago/.+     { return 301 /catalog; }
    location ~ ^/cortinas-blackout/.+            { return 301 /catalog; }
    location ~ ^/cortinas-screen/.+              { return 301 /catalog; }
    location ~ ^/cortinas-duo/.+                 { return 301 /catalog; }
    location ~ ^/cortinas-motorizadas/.+         { return 301 /domotica; }
    location ~ ^/persianas/.+                    { return 301 /catalog; }
    location ~ ^/persianas-venecianas/.+         { return 301 /catalog; }
    location ~ ^/toldos/.+                       { return 301 /catalog; }
    location ~ ^/toldos-retractiles/.+           { return 301 /catalog; }
    # Exactos (con o sin trailing slash)
    location ~ ^/cortinas-roller(/)?$      { return 301 /catalog; }
    location ~ ^/cortinas-roller-santiago(/)?$ { return 301 /catalog; }
    location ~ ^/persianas(/)?$            { return 301 /catalog; }
    location ~ ^/toldos(/)?$              { return 301 /catalog; }
    location ~ ^/sobre-nosotros(/)?$      { return 301 /about; }
    location ~ ^/contacto(/)?$            { return 301 /contact; }
    location ~ ^/solicitar-cotizacion(/)?$ { return 301 /quote; }
    location ~ ^/cotizar(/)?$             { return 301 /quote; }
    location ~ ^/instalacion(/)?$         { return 301 /about; }
    location ~ ^/garantia(/)?$            { return 301 /faq; }
    location ~ ^/cortinas(/)?$            { return 301 /catalog; }
    location ~ ^/cortinas-blackout(/)?$   { return 301 /catalog; }
    location ~ ^/cortinas-screen(/)?$     { return 301 /catalog; }
    location ~ ^/cortinas-duo(/)?$        { return 301 /catalog; }
    location ~ ^/cortinas-roller-duo(/)?$  { return 301 /catalog; }
    location ~ ^/cortinas-motorizadas(/)?$ { return 301 /domotica; }
    location ~ ^/persianas-venecianas(/)?$ { return 301 /catalog; }
    location ~ ^/toldos-retractiles(/)?$  { return 301 /catalog; }
    location ~ ^/nosotros(/)?$            { return 301 /about; }
    location ~ ^/quienes-somos(/)?$       { return 301 /about; }

    # Trailing slash -> canonical sin slash (301). Googlebot pidio /domotica/ y
    # recibia 404, gastando crawl budget. La raiz / se deja intacta.
    location ~ ^(?<path_noslash>/.+)/$ {
        return 301 $path_noslash$is_args$args;
    }

    # Dynamic sitemap from backend
    location = /sitemap.xml {
        proxy_pass http://backend:5000/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap obsoleto: 404 limpio para que Google deje de rastrearlo
    location = /sitemap-products.xml {
        return 404;
    }

    # Block admin routes from search engines
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - with bot prerendering
    location / {
        # If bot, proxy to prerender endpoint
        if ($is_bot) {
            rewrite ^(.*)$ /api/prerender?path=$1? break;
            proxy_pass http://backend:5000;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Crawler control files must come from disk, never from the bot prerender.
    # Exact-match locations win over the regex/prefix blocks below.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Service worker: fixed filename, must never be cached or updates never ship
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Cache static assets (Vite generates hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Limit upload size
        client_max_body_size 50m;
    }

    # Proxy uploads directory (^~ takes priority over regex rules below)
    location ^~ /uploads {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
