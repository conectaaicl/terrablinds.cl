services:
  radar_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/secrets:/app/secrets
    networks:
      - terrablinds_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/radar/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  terrablinds_net:
    external: true
    name: terrablinds_terrablinds_network
